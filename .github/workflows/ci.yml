name: Validate options calculator

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install application and independent reference engine
        run: python -m pip install . -r requirements-validation.txt
      - name: Verify quantitative, accounting and local HTTP behavior
        run: python -m unittest discover -s tests -v
      - name: Check JavaScript syntax
        run: node --check optionslab/static/app.js
      - name: Exercise installed command line
        run: |
          python -m optionslab demo --output /tmp/portfolio.json
          python -m optionslab analyze /tmp/portfolio.json --spot 110 --vol-shift 0.05 --output /tmp/scenario.json

